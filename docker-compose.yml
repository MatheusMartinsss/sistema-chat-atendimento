services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "8000:8000"
    networks:
      - laravel
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: chat
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: chat
      MYSQL_PASSWORD: chat
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: [ "mysqld", "--default-authentication-plugin=mysql_native_password" ]

networks:
  laravel:
    driver: bridge

volumes:
  db_data:
    driver: local